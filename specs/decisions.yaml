decisions:
  - id: AD-001
    title: Nenhuma aprovação depende de LLM
    status: superseded
    superseded_by: AD-005
    decision: Todo veredito do sdd vem de execução determinística (testes, gates, git, mutação).
    rationale: Um LLM pode ser útil como revisor, mas aprovar exige reprodutibilidade.
  - id: AD-002
    title: Evidência de teste vem do JUnit XML
    decision: O rastreio lê resultados reais em JUnit XML, ligados por ID no nome do teste.
    rationale: Formato suportado por praticamente todo runner; dispensa plugin por linguagem.
  - id: AD-004
    title: Juiz LLM só em evals marcadas, por política explícita
    decision: >-
      Evals podem usar judge: llm apenas se o projeto declarar evals.allow_llm_judge: true.
      ACs e NFRs nunca usam juiz LLM. O sdd agrega sempre de forma determinística e o
      relatório marca esses evals como probabilísticos.
    rationale: >-
      O julgamento de casos pode ser probabilístico mesmo quando a agregação é
      determinística. A política e o relatório tornam essa dependência visível,
      conforme AD-005; a revisão humana do harness e do dataset continua necessária.
  - id: AD-003
    title: Mutação textual por operadores
    decision: sdd mutate troca operadores no texto, numa cópia isolada, e lê só o exit code.
    rationale: Agnóstico de linguagem; ferramentas dedicadas (mutmut, Stryker) seguem usáveis como gates.
  - id: AD-005
    title: Verificações externas ao agente, com alcance e tipo de evidência explícitos
    decision: >-
      Testes, gates, diff, arquitetura e mutação produzem vereditos por execução de
      ferramentas. A agregação de evals é determinística, mas evals com judge: llm
      dependem de julgamento probabilístico e exigem política explícita (AD-004).
      Uma declaração de cobrança não comprova que o comando foi executado.
    rationale: >-
      Distinguir execução, declaração e julgamento probabilístico impede que um
      relatório aprovado sugira garantias além das evidências coletadas.
  - id: AD-007
    title: Revisão escalonada por risco com piso determinístico
    decision: >-
      O tier de revisão de uma mudança vem de regras declaradas (globs por tier, specs/ e
      severidade dos riscos das specs donas). Classificadores e revisores LLM externos entram
      por arquivo e só podem elevar o tier; achados de LLM exigem review.allow_llm_findings e
      são evidência probabilística. Aprovação de agente nunca conta como aprovação humana.
    rationale: >-
      Tier por caminho não enxerga risco semântico, e um modelo enxerga mas varia entre
      execuções. A assimetria preserva um piso reproduzível e auditável e aproveita o modelo
      só para apertar a regra, nunca para afrouxá-la.
  - id: AD-008
    title: Aprovação humana registrada é condição para implementar, não evidência de pronto
    decision: >-
      A aprovação da spec (requisitos e escopo) e a do plano (design e tarefas) ficam na
      própria spec, com as palavras de quem aprovou e o hash do conteúdo semântico de cada
      etapa. Com require_approval, aprovação ausente ou desatualizada é aviso no validate e
      bloqueia o guide na etapa implement; check, diff e mutate não a leem e continuam
      decidindo o que está pronto.
    rationale: >-
      A aprovação governa quando o agente pode começar, e o hash impede que uma spec alterada
      depois herde a aprovação anterior. O kit não autentica quem aprovou; tratá-la como
      evidência de implementação misturaria declaração humana com execução de ferramentas
      (AD-005).
  - id: AD-006
    title: Separar carregamento, execução e persistência protegida
    decision: >-
      project carrega declarações; core executa checks; artifacts protege IO;
      evidence interpreta resultados por regra. Imports públicos de core permanecem compatíveis.
    rationale: >-
      Uma regra de IO e evidência compartilhada evita falhas inconsistentes e concentra
      correções sem criar interfaces abstratas sem adaptadores reais.
