principles:
  - id: CONST-01
    rule: Nenhuma aprovação do kit depende de um LLM; todo veredito vem de execução determinística.
    enforced_by: [ARCH-003]
  - id: CONST-02
    rule: O motor de verificação não depende da CLI e pode ser usado como biblioteca.
    enforced_by: [ARCH-001]
  - id: CONST-03
    rule: O schema só descreve; não executa comandos nem conhece o motor.
    enforced_by: [ARCH-002]
  - id: CONST-04
    rule: Todo critério tem teste passando com o ID no nome.
    enforced_by: [kit:check]
  - id: CONST-05
    rule: Os testes detectam código errado (mutação de 90% ou mais nos módulos).
    enforced_by: [kit:mutate]
  - id: CONST-06
    rule: Todo comando externo tem timeout e mata a árvore de processos ao estourar.
    enforced_by: [kit:dependencies, AC-059]
  - id: CONST-07
    rule: O kit funciona em Linux, macOS e Windows, com Python 3.10 a 3.13.
    manual: job test do CI em 3 sistemas e 4 versões do Python, obrigatório para o merge
  - id: CONST-08
    rule: Nenhuma leitura ou escrita depende da codificação padrão do sistema.
    manual: o CI roda os testes com EncodingWarning tratado como erro
