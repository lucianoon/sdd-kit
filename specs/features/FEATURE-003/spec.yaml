feature: mutacao
version: 4
size: large
summary: Medir operadores mutados numa cópia isolada e preservar o diretório original.
assumptions:
- assumption: linguagens alvo da mutação não foram fixadas
  chosen: operadores textuais comuns a Python e linguagens com sintaxe C, com regras léxicas por
    extensão (comentário, aspas, generics e JSX) e operadores restritos à linguagem onde valem
  rationale: cobre a maioria das stacks sem depender de parser por linguagem; a regra por extensão
    evita lacunas silenciosas (// em Python) e mutantes que só quebram a compilação
open_questions: []
decisions:
- AD-005
- AD-002
- AD-003
- AD-004
out_of_scope:
- Detecção de divergência entre prosa em Markdown e código
- Adaptadores específicos por ferramenta (AGENTS.md cobre o MVP)
requirements:
- id: REQ-010
  description: Medir se os testes detectam código errado, sem LLM.
  acceptance:
  - id: AC-029
    given: testes que verificam os resultados
    when: sdd mutate roda
    then: todos os mutantes morrem e o mutate aprova
  - id: AC-030
    given: testes que só executam o código sem verificar
    when: sdd mutate roda
    then: o mutate reprova listando cada sobrevivente com arquivo e linha
  - id: AC-031
    given: qualquer execução do mutate
    when: ela termina
    then: o diretório de trabalho fica idêntico ao de antes
  - id: AC-032
    given: uma suíte que já falha sem mutações
    when: sdd mutate roda
    then: o mutate sai com erro em vez de medir
  - id: AC-120
    given: uma suíte que passa, mas sem mutações já excede mutation.timeout
    when: sdd mutate roda
    then: o mutate sai com erro que cita o timeout em segundos, distinto de suíte falhando
  - id: AC-033
    given: operadores dentro de strings, comentários ou linhas com sdd no-mutate
    when: os candidatos são gerados
    then: esses trechos não são mutados
  - id: AC-088
    given: cópias de trabalho órfãs de execuções mortas à força no diretório temporário do sistema (sdd-mutate-*)
    when: o mutate inicia
    then: as cópias mais velhas que 24 h são removidas e as recentes, de execuções concorrentes, preservadas
  - id: AC-056
    given: um mutante que faz os testes travarem
    when: sdd mutate roda
    then: o mutante conta como morto por timeout
  - id: AC-057
    given: uma mutação que não altera o tamanho do arquivo
    when: sdd mutate roda
    then: os testes rodam sem bytecode em cache e cada escrita recebe um mtime novo
  - id: AC-093
    given: uma suíte que remove temporários de outras execuções ou apaga sua própria cópia de trabalho
    when: sdd mutate roda
    then: temporários dos filhos ficam isolados; cópia indisponível produz erro de execução incompleta
      e nunca aprovação por pontuação parcial
- id: REQ-028
  description: Preservar o checkout durante mutação mesmo com links.
  acceptance:
  - id: AC-107
    given: candidato de mutação em symlink que aponta para fora da cópia ou dependência compartilhada
    when: a mutação seleciona alvos
    then: recusa o alvo inseguro antes de escrever e preserva o arquivo original
- id: REQ-033
  description: Mutar conforme a sintaxe da linguagem e com operadores que expõem testes fracos comuns.
  acceptance:
  - id: AC-115
    given: '`//` em Python (divisão inteira) ou `#` em JS/TS (campo privado), seguidos de operadores na mesma linha'
    when: os candidatos são gerados
    then: os operadores depois deles são mutados; `#` em Python e `//` em linguagens com sintaxe C continuam
      sendo comentário
  - id: AC-116
    given: '`<` e `>` de tipos genéricos (TS, Java, Kotlin, C#, Rust, C++, Swift, Scala) ou de tags JSX numa
      linha que também tem uma comparação'
    when: os candidatos são gerados
    then: só a comparação é mutada; os delimitadores de tipo e de tag não geram candidato
  - id: AC-117
    given: um mutante que não compila
    when: sdd mutate roda
    then: em Python o candidato com erro de sintaxe é descartado antes de rodar testes; com `mutation.build`
      configurado, a falha do build marca o mutante como inválido, fora do score e listado no relatório;
      nunca conta como morto
  - id: AC-118
    given: código com `not`, `is`, `in` (Python), `!` (sintaxe C), `*`, `/` e `%` binários, constantes inteiras
      e `return <expressão>` de uma linha (Python, JS e TS)
    when: os candidatos são gerados
    then: cada construção gera seu mutante (remoção ou inversão, `*`↔`/`, `%`→`*`, n→n+1, `return None` ou
      `return undefined`); o `in` de `for ... in`, `**`, ponteiros e `return` de várias linhas não são mutados
  - id: AC-119
    given: '`+` ou `-` grudados num identificador terminado em `e` (size+1) e em notação científica (1e-5)'
    when: os candidatos são gerados
    then: o do identificador é mutado e o da notação científica não
design:
  numbers:
  - metric: specs por projeto
    max: 500
    unit: arquivos
    source: estimativa do autor
  data_flow:
    ingress:
    - via: arquivo ou chamada de biblioteca
      source: código e comando de testes
      frequency: a cada execução do comando
    egress:
    - to: resultado estruturado e relatório quando aplicável
      consumers:
      - CLI
      - biblioteca
      - CI
      freshness: imediata
  alternatives:
  - name: mutação textual por operadores
    chosen: true
    why: funciona em várias linguagens sem parser por stack
  - name: parser e mutação específicos por linguagem
    why_not: aumenta dependências; ferramentas dedicadas podem ser gates
  risks:
  - area: data_integrity
    severity: high
    description: teste com o ID certo no nome mas que não verifica o comportamento
    mitigated_by:
    - AC-029
    - AC-030
  - area: data_integrity
    severity: medium
    description: mutação textual gera mutantes equivalentes que sobrevivem sem culpa dos testes
    accepted: marcação sdd no-mutate e min_score abaixo de 100% absorvem o ruído
  - area: data_integrity
    severity: high
    description: mutante que só quebra a compilação conta como morto e infla o score
    mitigated_by:
    - AC-116
    - AC-117
  - area: data_integrity
    severity: medium
    description: regra léxica errada esconde código da mutação e o score sobe sem medir nada
    mitigated_by:
    - AC-115
    - AC-119
  - area: data_integrity
    severity: high
    description: mutate corromper o código do usuário
    mitigated_by:
    - AC-031
  - area: data_integrity
    severity: high
    description: mutante falso sobrevivente por cache de bytecode, desacreditando a mutação
    mitigated_by:
    - AC-057
  - area: other
    severity: medium
    description: motor acoplado à CLI impede uso como biblioteca e testes isolados
    mitigated_by:
    - ARCH-001
    - ARCH-002
  dependencies:
  - name: suíte de testes sob mutação
    kind: process
    timeout_ms: 120000
    retry:
      max_attempts: 1
      backoff: none
    fallback: timeout conta como mutante morto
    side_effects: false
    idempotent: true
    covered_by:
    - AC-056
    - AC-032
