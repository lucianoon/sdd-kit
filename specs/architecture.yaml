rules:
  - id: ARCH-001
    description: O motor de verificação não depende da CLI (usável como biblioteca)
    from:
      - src/sdd/core.py
      - src/sdd/models.py
      - src/sdd/diff.py
      - src/sdd/arch.py
      - src/sdd/evals.py
      - src/sdd/mutation.py
      - src/sdd/procs.py
      - src/sdd/textscan.py
      - src/sdd/profile.py
      - src/sdd/specify.py
      - src/sdd/report.py
      - src/sdd/analysis.py
      - src/sdd/layers.py
      - src/sdd/review.py
      - src/sdd/workflow.py
      - src/sdd/project.py
      - src/sdd/artifacts.py
      - src/sdd/evidence.py
      - src/sdd/integrations.py
      - src/sdd/learning.py
      - src/sdd/changes.py
      - src/sdd/adapters.py
      - src/sdd/governance.py
    forbid: [typer, click]
    forbid_paths: [src/sdd/cli]
  - id: ARCH-002
    description: O schema só descreve; não executa comandos nem conhece o motor
    from: [src/sdd/models.py]
    forbid: [subprocess, shutil, typer]
    forbid_paths: [src/sdd/core, src/sdd/diff, src/sdd/arch, src/sdd/evals, src/sdd/mutation]
  - id: ARCH-003
    description: O kit agrega evidências sem importar SDK de modelo; juiz LLM fica no harness externo (AD-005)
    from: ["src/sdd/**"]
    forbid: [openai, anthropic, "langchain*", "langgraph*", litellm, google.generativeai, "google.genai", cohere, mistralai, ollama]

  - id: ARCH-004
    description: Carregamento e schema não dependem do executor de comandos
    from: [src/sdd/project.py, src/sdd/models.py]
    forbid: [subprocess, shutil, typer, click]
    forbid_paths: [src/sdd/core, src/sdd/procs, src/sdd/evals, src/sdd/mutation, src/sdd/cli]
  - id: ARCH-005
    description: Interpretação de evidências não executa comandos nem conhece a CLI
    from: [src/sdd/evidence.py]
    forbid: [subprocess, shutil, typer, click]
    forbid_paths: [src/sdd/core, src/sdd/procs, src/sdd/cli]
