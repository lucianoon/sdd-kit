version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/examples/jest, /examples/vitest]
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /examples/go
    schedule: { interval: weekly }
