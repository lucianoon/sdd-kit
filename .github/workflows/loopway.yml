# Loop de agentes do loopway sobre este repositório (ver loopway.toml).
#
# Entrada:
#   - PR de spec com a label loop:ready → o loop implementa na mesma branch
#   - issue com loop:ready e a linha `fix: AC-NNN` → o loop abre um PR de correção
#
# Secrets:
#   ANTHROPIC_API_KEY
#   LOOPWAY_PAT  fine-grained: Contents, Issues e Pull requests (escrita) neste repo e
#                Contents (leitura) em lucianoon/loopway-ai. Com o GITHUB_TOKEN, os
#                pushes do loop não disparariam o workflow `ci` nos PRs dele.
# Pausa sem mexer no código: variável LOOPWAY_STOP=1 ou uma issue com a label loop:stop.
name: loopway

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      number:
        description: "Executar só este PR ou issue da fila (opcional)"
        required: false

concurrency:
  group: loopway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  loop:
    # Pausa documentada acima: com LOOPWAY_STOP=1 o schedule nem inicia.
    if: ${{ vars.LOOPWAY_STOP != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.LOOPWAY_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LOOPWAY_STOP: ${{ vars.LOOPWAY_STOP }}
    steps:
      # Segredo ausente é configuração pendente, não falha de código. Sem esta
      # checagem o checkout recebe token vazio e o cron fica vermelho a cada 30
      # minutos sem dizer o que falta.
      - name: Checar configuração
        id: config
        env:
          PAT: ${{ secrets.LOOPWAY_PAT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$PAT" ] && missing="$missing LOOPWAY_PAT"
          [ -z "$KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Segredos ausentes:$missing. Loop pulado até configurar."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOPWAY_PAT }}
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with: { node-version: "22" }
      - name: Instalar ferramentas
        if: steps.config.outputs.ready == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -e ".[dev]"
          pip install "loopway-ai @ git+https://x-access-token:${{ secrets.LOOPWAY_PAT }}@github.com/lucianoon/loopway-ai"
          git config user.name "loopway[bot]"
          git config user.email "loopway@users.noreply.github.com"
      - name: Rodar loop
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ -n "${{ inputs.number }}" ]; then
            loopway implement "${{ inputs.number }}"
          else
            loopway run
          fi
      - name: Resumo
        if: always() && steps.config.outputs.ready == 'true'
        run: loopway status >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guardar trilha de auditoria
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: loopway-audit-${{ github.run_id }}
          path: .loopway/*.jsonl
          if-no-files-found: ignore
          retention-days: 90
