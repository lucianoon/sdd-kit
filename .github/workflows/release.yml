# Publicação sem manual: tag `v*` builda e publica no PyPI (trusted publishing).
# Configurar UMA vez no PyPI (Settings → Publishing → Add new pending publisher):
#   PyPI project name: sdd-kit-ai
#   Owner: lucianoon · Repository: sdd-kit · Workflow: release.yml · Environment: pypi
name: release
permissions:
  contents: read
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" twine
      - name: Conferir tag e versão
        run: python -c "import os; from sdd import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'tag difere da versão do pacote'"
      - run: sdd validate
      - run: sdd check
      - run: python -m build
      - name: Smoke do pacote instalado
        shell: bash
        run: python scripts/smoke_dist.py dist/*.whl
      # Falha antes de publicar com metadados quebrados (licença, readme, name...).
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC do trusted publishing; sem segredo no repo
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Extrair notas do CHANGELOG
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag inesperada: {tag}")
          ver = tag[1:]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n+(.*?)(?=^## |\Z)",
              text,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md sem seção [{ver}]")
          notes = match.group(1).strip() + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
