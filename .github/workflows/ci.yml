name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      # O plugin transforma cada teste que falha em anotação no PR/commit.
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      # Codificação implícita vira erro: pega no Linux os bugs que só apareceriam no Windows.
      - run: python -W error::EncodingWarning -m pytest -q
        env: { PYTHONWARNDEFAULTENCODING: "1" }

  # O kit verifica a si mesmo com as próprias regras.
  sdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: sdd validate
      - run: sdd analyze
      - if: github.event_name == 'pull_request'
        run: sdd diff --base "origin/${{ github.base_ref }}"
      - run: sdd check
      - if: github.event_name == 'pull_request'
        run: sdd mutate --base "origin/${{ github.base_ref }}"
      - if: always()
        shell: bash
        run: cat .sdd/analyze.md .sdd/report.md .sdd/mutation.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # Prova de agnosticismo: o rastreio funciona com os runners reais de outras stacks.
  exemplos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.24", cache: false }
      - run: pip install -e ".[dev]"
      - run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - name: pytest
        working-directory: examples/pytest
        run: sdd check
      - name: multi (2 features)
        working-directory: examples/multi
        run: sdd check
      - name: jest
        working-directory: examples/jest
        run: npm ci && sdd check
      - name: vitest
        working-directory: examples/vitest
        run: npm ci && sdd check
      - name: go
        working-directory: examples/go
        run: sdd check
