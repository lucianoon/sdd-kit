name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      # O plugin transforma cada teste que falha em anotação no PR/commit.
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      # Codificação implícita vira erro: pega no Linux os bugs que só apareceriam no Windows.
      - name: Testes
        run: python -W error::EncodingWarning -m pytest -q --cov=sdd --cov-report=term --cov-report=json
        env: { PYTHONWARNDEFAULTENCODING: "1" }
      - name: Cobertura no resumo
        if: always()
        shell: bash
        run: |
          if [ ! -f coverage.json ]; then
            echo "::warning::Relatório de cobertura ausente (coverage.json)"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          data = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          t = data["totals"]
          print("## Cobertura")
          print()
          print(f"- Cobertura: **{t['percent_covered']:.1f}%**")
          print(f"- Linhas cobertas: {t['covered_lines']}/{t['num_statements']}")
          print(f"- Python {os.environ.get('pythonLocation', '')} / {os.environ.get('RUNNER_OS', '')}")
          print()
          print("| Arquivo | Cobertura | Linhas |")
          print("|---|---:|---:|")
          for name, info in sorted(data.get("files", {}).items()):
              s = info["summary"]
              print(f"| `{name}` | {s['percent_covered']:.1f}% | {s['covered_lines']}/{s['num_statements']} |")
          PY

  # Versões mínimas declaradas em pyproject.toml, no Python mais antigo suportado.
  test-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - name: Instalar com versões mínimas
        run: |
          pip install -e ".[dev]"
          # 0.12.0 é meta-pacote; 0.12–0.15 quebram com Click 8.2+ (make_metavar / stderr).
          pip install "typer==0.16.0" "pydantic==2.6.0" "pyyaml==6.0"
          python -c "import typer, pydantic, yaml; print('typer', typer.__version__); print('pydantic', pydantic.VERSION); print('pyyaml', yaml.__version__)"
      - run: python -W error::EncodingWarning -m pytest -q
        env: { PYTHONWARNDEFAULTENCODING: "1" }

  # O kit verifica a si mesmo com as próprias regras.
  sdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: sdd validate
      - run: sdd analyze
      - if: github.event_name == 'pull_request'
        run: sdd diff --base "origin/${{ github.base_ref }}"
      - run: sdd check
      - if: github.event_name == 'pull_request'
        run: sdd mutate --base "origin/${{ github.base_ref }}"
      # Informativo: tier e aprovações humanas exigidas. Não bloqueia; a branch protection decide.
      - if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.base_ref }}
        run: sdd risk --base "origin/$BASE" --author "$AUTHOR"
      - if: always()
        shell: bash
        run: |
          found=0
          for f in .sdd/analyze.md .sdd/report.md .sdd/mutation.md .sdd/risk.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              found=1
            else
              echo "::warning::Relatório ausente: $f"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::Nenhum relatório SDD foi gerado para o resumo."
          fi

  # Prova de agnosticismo: o rastreio funciona com os runners reais de outras stacks.
  exemplos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-go@v7
        with: { go-version: "1.24", cache: false }
      - run: pip install -e ".[dev]"
      - run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      - name: pytest
        working-directory: examples/pytest
        run: sdd check
      - name: RAG offline, evals, manifesto e comparação
        working-directory: examples/rag
        run: |
          sdd validate
          sdd check
          sdd eval
          python evaluate.py run --out .sdd/baseline
          python evaluate.py compare .sdd/baseline .sdd/evals
          python evaluate.py benchmark .sdd/evals --max-p95-ms 1000
      - name: multi (2 features)
        working-directory: examples/multi
        run: sdd check
      - name: jest
        working-directory: examples/jest
        run: npm ci && sdd check
      - name: vitest
        working-directory: examples/vitest
        run: npm ci && sdd check
      - name: go
        working-directory: examples/go
        run: sdd check
