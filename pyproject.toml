[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-kit-ai"
version = "0.15.0"
description = "SDD agnóstico: especificações como contrato, verificação fora do LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luciano Oliveira Nunes" }]
keywords = ["sdd", "spec-driven-development", "ai-agents", "llm", "evals", "mutation-testing"]
dependencies = ["typer>=0.12,<1", "pydantic>=2.6,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2", "hatchling>=1.25", "pip>=23"]  # pip: smoke do wheel instalado

[project.scripts]
sdd = "sdd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
